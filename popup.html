<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QueueCraft</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 340px;
      max-height: 480px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-size: 13px;
      user-select: none;
    }

    /* Minimal Header */
    header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .brand-icon {
      width: 14px;
      height: 14px;
      background: #ef4444;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: white;
    }

    .meta-tags {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-tag {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
    }

    .count-tag {
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(37, 99, 235, 0.35);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 9999px;
    }

    /* Action Bar */
    .action-bar {
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      background: var(--card);
      border-bottom: 1px solid var(--card-border);
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-play {
      flex: 1;
      background: var(--primary);
      color: #ffffff;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      gap: 6px;
    }
    .btn-play:hover {
      background: var(--primary-hover);
    }

    .btn-clear-all {
      background: transparent;
      color: #94a3b8;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
    }
    .btn-clear-all:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }

    /* Video List */
    .video-list {
      list-style: none;
      overflow-y: auto;
      max-height: 330px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .video-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: grab;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }

    .video-item:active {
      cursor: grabbing;
    }

    .video-item:hover {
      background: rgba(51, 65, 85, 0.7);
    }

    .video-item.active {
      border-color: rgba(37, 99, 235, 0.7);
      background: rgba(37, 99, 235, 0.15);
    }

    /* Dragging States */
    .video-item.dragging {
      opacity: 0.35;
      border: 1px dashed #60a5fa;
    }

    .video-item.drag-over {
      border-top: 2px solid #3b82f6;
    }

    .drag-handle {
      color: #475569;
      font-size: 13px;
      line-height: 1;
      padding: 2px;
      cursor: grab;
    }
    .video-item:hover .drag-handle {
      color: #94a3b8;
    }

    .video-order {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .video-item.active .video-order {
      background: #10b981;
      color: #fff;
    }

    .video-thumb-container {
      position: relative;
      width: 48px;
      height: 30px;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }

    .video-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .video-dur-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 8.5px;
      font-weight: 600;
      padding: 1px 3px;
      border-radius: 2px;
      line-height: 1;
    }

    .video-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .video-title {
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.35;
      color: #e2e8f0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
    }
    .video-info:hover .video-title {
      color: #60a5fa;
    }

    .btn-remove-item {
      background: transparent;
      color: #64748b;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 13px;
      flex-shrink: 0;
    }
    .btn-remove-item:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    /* Clean Empty State */
    .empty-state {
      padding: 38px 16px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 24px;
      margin-bottom: 6px;
    }
    .empty-title {
      font-weight: 600;
      color: #cbd5e1;
      font-size: 12.5px;
      margin-bottom: 2px;
    }
    .empty-hint {
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-icon">▶</span>
      <span>QueueCraft</span>
    </div>
    <div class="meta-tags">
      <span class="time-tag" id="header-time"></span>
      <span class="count-tag" id="header-count">0 vids</span>
    </div>
  </header>

  <div class="action-bar" id="action-bar">
    <button class="btn-play" id="btn-play">▶ Play Queue</button>
    <button class="btn-clear-all" id="btn-clear">Clear</button>
  </div>

  <ul class="video-list" id="video-list"></ul>

  <script src="popup.js"></script>
</body>
</html>
